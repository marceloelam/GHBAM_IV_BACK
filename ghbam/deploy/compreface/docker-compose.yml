services:
  compreface-postgres:
    image: postgres:13
    container_name: ghbam-compreface-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - compreface-postgres:/var/lib/postgresql/data
    networks:
      - compreface

  compreface-admin:
    image: exadel/compreface-admin:1.2.0
    container_name: ghbam-compreface-admin
    restart: unless-stopped
    depends_on:
      - compreface-postgres
      - compreface-api
    environment:
      POSTGRES_URL: jdbc:postgresql://compreface-postgres:5432/${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    networks:
      - compreface

  compreface-api:
    image: exadel/compreface-api:1.2.0
    container_name: ghbam-compreface-api
    restart: unless-stopped
    depends_on:
      - compreface-postgres
      - compreface-core
    environment:
      POSTGRES_URL: jdbc:postgresql://compreface-postgres:5432/${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SAVE_IMAGES_TO_DB: "false"
    networks:
      - compreface

  compreface-core:
    image: exadel/compreface-core:1.2.0
    container_name: ghbam-compreface-core
    restart: unless-stopped
    environment:
      ML_PORT: 3000
    networks:
      - compreface

  compreface-ui:
    image: exadel/compreface-fe:1.2.0
    container_name: ghbam-compreface-ui
    restart: unless-stopped
    depends_on:
      - compreface-api
      - compreface-admin
    ports:
      - "127.0.0.1:8000:80"
    networks:
      - compreface

networks:
  compreface:
    name: ghbam-compreface

volumes:
  compreface-postgres:
    name: ghbam-compreface-postgres
