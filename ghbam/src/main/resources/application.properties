# =============================================================================
# SERVIDOR
# =============================================================================
quarkus.http.host=0.0.0.0
quarkus.http.port=8080

# Reconstrói a URL pública original (/api) a partir dos headers definidos pelo Nginx.
# Somente o proxy local é confiável; requisições diretas não podem forjar esses headers.
quarkus.http.proxy.proxy-address-forwarding=true
quarkus.http.proxy.allow-forwarded=false
quarkus.http.proxy.allow-x-forwarded=true
quarkus.http.proxy.enable-forwarded-host=true
quarkus.http.proxy.enable-forwarded-prefix=true
quarkus.http.proxy.trusted-proxies=127.0.0.1 


# =============================================================================
# APP
# =============================================================================
app.version=4.0.0

# Pasta-base dos vídeos do painel de chamada (cada unidade usa {dir}/{sigla}/)
app.painel-videos.dir=${PAINEL_VIDEOS_DIR:painel-videos}

# Voz neural do painel de chamada (roda local no servidor; nada sai da rede).
# false = painel usa a voz do navegador. Qualquer falha também volta para ela.
ghbam.painel.voz.habilitado=${GHBAM_PAINEL_VOZ_HABILITADO:false}
# Siglas separadas por vírgula para piloto (ex.: HMSFX). Sem valor = todas as unidades.
#ghbam.painel.voz.unidades=${GHBAM_PAINEL_VOZ_UNIDADES}
# Voz usada quando a unidade não escolheu: kokoro-dora (fem.), kokoro-alex, kokoro-santa, piper-faber
ghbam.painel.voz.padrao=${GHBAM_PAINEL_VOZ_PADRAO:kokoro-dora}
# Kokoro (vozes mais naturais) via sherpa-onnx: binário + pasta do modelo kokoro-multi-lang-v1_0 (fp32)
ghbam.painel.voz.kokoro.executavel=${KOKORO_EXECUTAVEL:/opt/tts/sherpa-onnx/bin/sherpa-onnx-offline-tts}
ghbam.painel.voz.kokoro.modelo-dir=${KOKORO_MODELO_DIR:/opt/tts/kokoro-multi-lang-v1_0}
ghbam.painel.voz.kokoro.threads=${KOKORO_THREADS:4}
# Serviço de voz (tools/servidor-voz): fala natural com pausa de respiração nas vírgulas.
# Sem ele, o Kokoro roda por linha de comando (mais lento e quase sem pausa na vírgula).
# Em produção: KOKORO_SERVICO_URL=http://127.0.0.1:8099 (vazio = sem serviço).
ghbam.painel.voz.kokoro.servico-url=${KOKORO_SERVICO_URL:}
# Piper (voz mais rápida): binário + pasta com os .onnx/.onnx.json
ghbam.painel.voz.piper.executavel=${PIPER_EXECUTAVEL:/opt/tts/piper/piper}
ghbam.painel.voz.piper.dir=${PIPER_DIR:/opt/tts/piper-vozes}
# Homologação local (Windows, quarkus:dev)
%dev.ghbam.painel.voz.habilitado=${GHBAM_PAINEL_VOZ_HABILITADO:true}
%dev.ghbam.painel.voz.kokoro.executavel=${KOKORO_EXECUTAVEL:C:/tts/sherpa-onnx-v1.13.8-win-x64-shared-MD-Release/bin/sherpa-onnx-offline-tts.exe}
%dev.ghbam.painel.voz.kokoro.modelo-dir=${KOKORO_MODELO_DIR:C:/tts/kokoro-multi-lang-v1_0}
%dev.ghbam.painel.voz.kokoro.servico-url=${KOKORO_SERVICO_URL:http://127.0.0.1:8099}
%dev.ghbam.painel.voz.piper.executavel=${PIPER_EXECUTAVEL:C:/piper/piper/piper.exe}
%dev.ghbam.painel.voz.piper.dir=${PIPER_DIR:C:/piper}

# -----------------------------------------------------------------------------
# HuggingFace / Featherless AI
# -----------------------------------------------------------------------------
# Token NÃO fica aqui — está em AppSecrets.java (HF_API_TOKEN)
# Endpoint esperado:
# POST /v1/chat/completions
# Body:
# {
#   "model": "...",
#   "messages": [...]
# }

hf.router.url=${HF_ROUTER_URL:https://router.huggingface.co/featherless-ai}

# Mapeamento:
# alias:modelo_real,alias2:modelo_real2
hf.model.map=${HF_MODEL_MAP:}

# Modelos disponíveis
hf.available.models=${HF_AVAILABLE_MODELS:Qwen/Qwen2.5-1.5B-Instruct,HuggingFaceH4/zephyr-7b-beta,Qwen/Qwen2.5-7B-Instruct,Qwen/Qwen3-1.7B}

# Modelo fallback
hf.fallback.model=${HF_FALLBACK_MODEL:Qwen/Qwen2.5-1.5B-Instruct}

# Request settings
hf.request.timeout.ms=${HF_REQUEST_TIMEOUT_MS:30000}
hf.request.retries=${HF_REQUEST_RETRIES:2}

# RAG embeddings
rag.embedding.local.url=${RAG_EMBEDDING_LOCAL_URL:http://localhost:8001/embed}
rag.embedding.local.timeout.seconds=${RAG_EMBEDDING_LOCAL_TIMEOUT_SECONDS:5}
rag.embedding.hf.timeout.seconds=${RAG_EMBEDDING_HF_TIMEOUT_SECONDS:10}


# =============================================================================
# BANCO DE DADOS (POSTGRESQL)
# =============================================================================
quarkus.datasource.db-kind=postgresql
# Sem Docker: nunca subir Postgres automático (Dev Services); faltando DB_* o erro fica explícito
quarkus.datasource.devservices.enabled=false
# Desliga todos os Dev Services: evita a busca do Testcontainers pelo Docker no boot do dev mode
quarkus.devservices.enabled=false
quarkus.datasource.username=${DB_USER:postgres}

# SEGURANÇA:
# senha fornecida exclusivamente via variável de ambiente
quarkus.datasource.password=${DB_PASSWORD}

quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?tcpKeepAlive=true&loginTimeout=30&connectTimeout=30&socketTimeout=120&applicationName=ghbam-app&reWriteBatchedInserts=true&preparedStatementCacheQueries=64&preparedStatementCacheSizeMiB=4&options=-c%20statement_timeout=60000%20-c%20idle_in_transaction_session_timeout=120000


# -----------------------------------------------------------------------------
# Pool de conexões
# -----------------------------------------------------------------------------
quarkus.datasource.jdbc.min-size=5
quarkus.datasource.jdbc.initial-size=5
quarkus.datasource.jdbc.max-size=50

# Timeouts
quarkus.datasource.jdbc.acquisition-timeout=PT60S
# O CacheMemoryContext do PostgreSQL so e liberado quando a conexao fecha.
# Vida longa + plan cache grande esgota a memoria do servidor (SQLState 53200).
quarkus.datasource.jdbc.max-lifetime=PT10M
quarkus.datasource.jdbc.idle-removal-interval=PT5M

# Validação de conexões
quarkus.datasource.jdbc.validate-on-borrow=true
quarkus.datasource.jdbc.background-validation-interval=PT2M

# Leak detection
quarkus.datasource.jdbc.leak-detection-interval=PT1M

# Health check
quarkus.datasource.health.enabled=true


# =============================================================================
# HIBERNATE / ORM
# =============================================================================
# Dev UI varre a pasta do projeto a cada subida; .venv-embedding tem ~35 mil arquivos e travava o start.
%dev.quarkus.dev-ui.workspace.ignore-folders=\\.venv-embedding,\\.venv.*,ObjectStore,logs,remessas,eval-results,\\.metadata,RemoteSystemsTempFiles,\\.apt_generated,target,node_modules,\\.git
# Schema e do Flyway; "update" comparava o banco inteiro a cada subida (lento) e alterava o schema.
%dev.quarkus.hibernate-orm.database.generation=none
# Transicao segura: preserva o comportamento atual. Depois de reconciliar e
# homologar todas as migracoes, definir HIBERNATE_SCHEMA_GENERATION=validate
# no ambiente de producao. Nunca alterar diretamente sem backup testado.
%prod.quarkus.hibernate-orm.database.generation=${HIBERNATE_SCHEMA_GENERATION:validate}
# O inicializador legado fica desligado; Flyway e a fonte de alteracoes do schema.
ghbam.clinical-schema-initializer.enabled=${GHBAM_CLINICAL_SCHEMA_INITIALIZER_ENABLED:false}

quarkus.hibernate-orm.log.sql=false

# =============================================================================
# FLYWAY V2 - linha controlada posterior ao baseline legado V68
# =============================================================================
# O catalogo antigo permanece fora desta localizacao para evitar colisoes e
# checksums incompatíveis. A migracao no startup fica desativada por padrao.
quarkus.flyway.locations=db/migration-v2
quarkus.flyway.table=ghbam_schema_history_v2
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=68
quarkus.flyway.baseline-description=GHBAM legacy schema through V68
quarkus.flyway.migrate-at-start=${GHBAM_FLYWAY_MIGRATE_AT_START:true}

# Batch / performance
quarkus.hibernate-orm.jdbc.statement-batch-size=20
quarkus.hibernate-orm.fetch.batch-size=16

# Timezone JDBC
quarkus.hibernate-orm.jdbc.timezone=UTC


# =============================================================================
# LDAP / ACTIVE DIRECTORY
# =============================================================================
quarkus.security.ldap.dir-context.url=${LDAP_SERVER_URI}
quarkus.security.ldap.dir-context.principal=${LDAP_BIND_DN}

# SEGURANÇA:
# senha via variável de ambiente
quarkus.security.ldap.dir-context.password=${LDAP_BIND_PASSWORD}

quarkus.security.ldap.identity-mapping.search-base-dn=${LDAP_USER_SEARCH_BASE}
quarkus.security.ldap.identity-mapping.rdn-identifier=${LDAP_RDN_IDENTIFIER:sAMAccountName}

# Configurações adicionais
ldap.admin.user=${LDAP_ADMIN_USER}
ldap.admin.password=${LDAP_ADMIN_PASSWORD}
ldap.domain=${LDAP_DOMAIN}


# =============================================================================
# LOGGING
# =============================================================================
quarkus.log.console.level=INFO
%dev.quarkus.log.console.level=INFO

# -----------------------------------------------------------------------------
# Diagnóstico de conexões
# -----------------------------------------------------------------------------
# DEBUG aqui gera uma linha por operacao de banco; religar so para depurar conexao.
%dev.quarkus.log.category."io.agroal".level=INFO
%dev.quarkus.log.category."org.postgresql".level=INFO
%dev.quarkus.log.category."org.hibernate.engine.jdbc.connections".level=INFO

