# =============================================================================
# INTEGRACAO SUS / RNDS
# =============================================================================
# Em producao, configure GHBAM_SUS_CREDENTIALS_KEY no ambiente do servidor.
# Em dev/test, a chave fixa evita perder a leitura dos segredos a cada restart.
ghbam.sus.credentials.key=${GHBAM_SUS_CREDENTIALS_KEY:}
%dev.ghbam.sus.credentials.key=${GHBAM_SUS_CREDENTIALS_KEY:ghbam-sus-dev-key-local-nao-usar-em-producao}
%test.ghbam.sus.credentials.key=${GHBAM_SUS_CREDENTIALS_KEY:ghbam-sus-test-key-local-nao-usar-em-producao}

# =============================================================================
# ENVIO FHIR (sumario de alta) - RISAH/RNDS-ready, generico por destino
# =============================================================================
# Disparo real fica sempre desligado ate existir uma linha ativa em
# fhir_envio_destino (ativo=true) com endpoint/credencial reais; sem isso,
# nenhuma chamada de rede e feita (ver FhirDispatchService).
ghbam.fhir.credentials.key=${GHBAM_FHIR_CREDENTIALS_KEY:}
%dev.ghbam.fhir.credentials.key=${GHBAM_FHIR_CREDENTIALS_KEY:ghbam-fhir-dev-key-local-nao-usar-em-producao}
%test.ghbam.fhir.credentials.key=${GHBAM_FHIR_CREDENTIALS_KEY:ghbam-fhir-test-key-local-nao-usar-em-producao}
ghbam.fhir.dispatch.max-tentativas=${GHBAM_FHIR_DISPATCH_MAX_TENTATIVAS:10}
ghbam.fhir.dispatch.retry.cron=${GHBAM_FHIR_DISPATCH_RETRY_CRON:1m}

# =============================================================================
# Consulta de CNS no cadastro publico do CNES (CPF + nascimento -> CNS)
# Usada pela /recepcao. Desligue com GHBAM_CNS_CONSULTA=false se o DATASUS
# estiver instavel: o campo volta a ser 100% digitado, nada mais quebra.
# =============================================================================
ghbam.cns.consulta.habilitado=${GHBAM_CNS_CONSULTA:true}
ghbam.cns.consulta.url=${GHBAM_CNS_CONSULTA_URL:https://cnesadm.datasus.gov.br/cnesadm/publico/usuarios/cadastro}
ghbam.cns.consulta.timeout.seconds=${GHBAM_CNS_CONSULTA_TIMEOUT:15}
ghbam.cns.consulta.cache.minutos=${GHBAM_CNS_CONSULTA_CACHE:60}

# =============================================================================
# Latitude/longitude do endereco do paciente (Nominatim/OpenStreetMap)
# Calculada em segundo plano depois de gravar/alterar o cadastro; envia so o endereco.
# VAZIO = DESLIGADO (nenhum endereco sai do servidor). Aponte para o Nominatim interno,
# ex.: GHBAM_GEOCODIFICACAO_URL=http://nominatim.interno:8080
# =============================================================================
ghbam.geocodificacao.url=${GHBAM_GEOCODIFICACAO_URL:}
ghbam.geocodificacao.timeout.seconds=${GHBAM_GEOCODIFICACAO_TIMEOUT:5}

# O toggle que liga a consulta oficial do PDQ na /recepcao NAO fica mais aqui - virou
# um registro no banco (tabela configuracao_cns_pdq, ver ConfiguracaoCnsPdqService),
# controlavel direto pela tela /base2/integracao-sus, sem precisar de deploy/restart.
# Estado inicial (migration V159): desativado - comportamento identico ao de antes.

# =============================================================================
# API oficial PDQ CADSUS/CNS do DATASUS (Manual de Integracao PDQ CNS v2.1)
# Usa o certificado digital ICP-Brasil (PFX/A1) ja salvo em integracao_sus_credencial
# (tela Integracao SUS) para autenticar via Two-way SSL e gerar token EHR-Auth.
# Enderecos fixos definidos pelo DATASUS, um par por ambiente (nao configuravel
# por unidade porque sao os mesmos hosts oficiais para todo mundo).
# =============================================================================
ghbam.cadsus.pdq.token-url.homologacao=${GHBAM_CADSUS_TOKEN_URL_HMG:https://ehr-auth-hmg.saude.gov.br/api/osb/token}
ghbam.cadsus.pdq.token-url.producao=${GHBAM_CADSUS_TOKEN_URL_PRD:https://ehr-auth.saude.gov.br/api/osb/token}
ghbam.cadsus.pdq.consulta-url.homologacao=${GHBAM_CADSUS_CONSULTA_URL_HMG:https://servicoshm.saude.gov.br/cadsus/v2/PDQSupplierJWT}
ghbam.cadsus.pdq.consulta-url.producao=${GHBAM_CADSUS_CONSULTA_URL_PRD:https://servicos.saude.gov.br/cadsus/v2/PDQSupplierJWT}
ghbam.cadsus.pdq.timeout.seconds=${GHBAM_CADSUS_TIMEOUT:20}
# Token oficial dura 30 minutos; renovamos 2 minutos antes para nao arriscar
# uma chamada com token vencido no meio do caminho.
ghbam.cadsus.pdq.token.margem-seguranca.minutos=${GHBAM_CADSUS_TOKEN_MARGEM:2}
# Token da RNDS (envio FHIR do Sumario de Alta, tipo de autenticacao RNDS_CERTIFICADO):
# mesmo certificado e mesmo EHR-Auth, mas path proprio da RNDS (o do CADSUS e /api/osb/token).
# Confirmar no guia rnds-guia.saude.gov.br (Ambientes) antes do primeiro teste em homologacao.
ghbam.rnds.token-url.homologacao=${GHBAM_RNDS_TOKEN_URL_HMG:https://ehr-auth-hmg.saude.gov.br/api/token}
ghbam.rnds.token-url.producao=${GHBAM_RNDS_TOKEN_URL_PRD:https://ehr-auth.saude.gov.br/api/token}

# =============================================================================
# Preparo automatico do Faturamento SUS (FaturamentoAutomacaoJob, 03:20 diario)
#
# abrir-competencia=false e o padrao: quem escolhe o mes a faturar e o operador,
# em Faturamento SUS > Competencias. Sem competencia aberta o job so registra o
# adiamento na auditoria (AUTOMACAO_FATURAMENTO/ADIADO) dizendo qual e o clique
# que falta. Ligue para voltar ao comportamento antigo (abertura pelo job).
#
# importar-sigtap busca o arquivo no FTP do DATASUS; desligue em ambiente sem
# saida para a internet, senao a tentativa se repete toda madrugada no log.
# habilitada=false para nada rodar.
# =============================================================================
ghbam.faturamento.automacao.habilitada=${GHBAM_FATURAMENTO_AUTOMACAO:true}
ghbam.faturamento.automacao.abrir-competencia=${GHBAM_FATURAMENTO_AUTOMACAO_ABRIR_COMPETENCIA:false}
ghbam.faturamento.automacao.importar-sigtap=${GHBAM_FATURAMENTO_AUTOMACAO_SIGTAP:true}
ghbam.faturamento.automacao.cron=${GHBAM_FATURAMENTO_AUTOMACAO_CRON:0 20 3 * * ?}

# GED - anexos ficam em ged_documento.conteudo_base64 (TEXT). O limite abaixo vale
# para o arquivo decodificado; em Base64 o corpo da requisicao fica ~33% maior,
# por isso max-body-size precisa de folga sobre o limite do GED.
quarkus.http.limits.max-body-size=25M
ghbam.ged.tamanho-maximo-bytes=15728640
ghbam.ged.mimes-permitidos=application/pdf,image/jpeg,image/png,image/webp
