# =============================================================================
# INTEGRACAO EXTERNA - CONSULTA DE PACIENTE (GET/POST /integracao/pacientes)
# =============================================================================
# Autenticacao pelo header X-API-Key. Formato: sistema|SIGLA_UNIDADE|chave (chave com
# 32+ caracteres), varias separadas por virgula. A unidade define a credencial CADSUS
# usada quando o paciente nao esta no cadastro local. Vazio = rota fechada (401).
#
# PRODUCAO: nunca escrever chave aqui. Definir no servidor, no ambiente do processo:
#   GHBAM_INTEGRACAO_API_KEYS=sistemaA|ITG|<chave-nova>,sistemaB|UPA|<outra-chave>
# e reiniciar; o log de subida mostra "N de N chave(s) valida(s)".
# Revogar uma chave = remove-la da variavel e reiniciar.
# A linha %dev abaixo e so para teste local (quarkus:dev) e e ignorada em producao.

#API GHABM/DATASUS
#   http://[host]:8080/integracao/pacientes
#{
# "nome":"JOAO DA SILVA",
# "nascimento":"31/01/1980",
# "mae":"MARIA DA SILVA",
# "cpf":"12345678900"
#}
#Chave:
#X-API-Key : 7119c87ff4114a41230e1ec8eeb473e56bc51f957e8f984c7a516c28807dd568

ghbam.integracao.api-keys=${GHBAM_INTEGRACAO_API_KEYS:}
%prod.ghbam.integracao.api-keys=${GHBAM_INTEGRACAO_API_KEYS:}
%dev.ghbam.integracao.api-keys=postman|DEV|7119c87ff4114a41230e1ec8eeb473e56bc51f957e8f984c7a516c28807dd568
}


