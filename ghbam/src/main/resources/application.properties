# =============================================================================
# SEGURANÇA / JWT
# =============================================================================
# Em producao, aponte para arquivos FORA do .jar (ex.: file:/opt/app/secrets/jwt/privateKey.pem)
# via GHBAM_JWT_PRIVATE_KEY_LOCATION / GHBAM_JWT_PUBLIC_KEY_LOCATION. O fallback classpath
# existe so para dev e nao quebrar ambientes atuais; o SecureConfigValidator avisa no startup.
smallrye.jwt.sign.key.location=${GHBAM_JWT_PRIVATE_KEY_LOCATION:classpath:jwt/privateKey.pem}
mp.jwt.verify.publickey.location=${GHBAM_JWT_PUBLIC_KEY_LOCATION:classpath:jwt/publicKey.pem}
mp.jwt.verify.issuer=ghbam-iv

# Autenticacao proativa DESLIGADA: por padrao o Quarkus, com smallrye-jwt
# instalado, tenta validar QUALQUER header Authorization: Bearer recebido
# ANTES de qualquer filtro JAX-RS rodar (inclusive o RbacRequestFilter
# customizado). Nenhum endpoint usa @RolesAllowed/@Authenticated — toda a
# autorizacao real passa pelo RbacRequestFilter/SecurityPermissionService.
# Com proactive=true, um Bearer malformado (ex.: header duplicado por um
# interceptador do frontend, virando "Bearer x, Bearer x" apos o RestEasy
# juntar valores repetidos) e rejeitado com 401 generico (corpo vazio,
# WWW-Authenticate: Bearer) sem nunca chegar no resolve() com fallback por
# X-GHBAM-MATRICULA — o filtro customizado nunca roda para esses casos.
quarkus.http.auth.proactive=false

# RBAC backend
# false = apenas auditoria/calculo sem bloqueio
# true  = exige Authorization Bearer em chamadas críticas
# Default religado para true em 2026-07-22 depois do sweep de autenticação do
# frontend: chamadas auxiliares/publicas nao recebem Bearer velho, leituras
# legadas de setor/sala usam o fluxo compatível e 401 auxiliar nao derruba a
# sessao. Em emergencia operacional, defina GHBAM_SECURITY_RBAC_ENFORCE=false.
ghbam.security.rbac.enforce=${GHBAM_SECURITY_RBAC_ENFORCE:true}
# Flag separado do enforce acima, so para as permissoes OBRIGATORIAS (logica E)
# de RoutePermissionCatalog.requiredAllPermissionsFor. Comeca em false de
# proposito: entradas nesse mapa so passam a bloquear de verdade depois de
# rodar em shadow (grep RBAC-SHADOW-REQUIRED nos logs) e confirmar que nao ha
# usuario legitimo pego de surpresa. Ver [[project_ghbam_rbac_gap_permissoes_finas]]
# na memoria do projeto.
ghbam.security.rbac.enforceRequiredPermissions=${GHBAM_SECURITY_RBAC_ENFORCE_REQUIRED_PERMISSIONS:false}
# Compatibilidade temporaria para telas legadas internas. Em producao publica,
# identidade por X-GHBAM-MATRICULA fica desligada por padrao.
ghbam.security.legacy-header-auth.enabled=${GHBAM_SECURITY_LEGACY_HEADER_AUTH_ENABLED:false}
%dev.ghbam.security.legacy-header-auth.enabled=${GHBAM_SECURITY_LEGACY_HEADER_AUTH_ENABLED:true}
%test.ghbam.security.legacy-header-auth.enabled=${GHBAM_SECURITY_LEGACY_HEADER_AUTH_ENABLED:true}


